<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yankees vs Red Sox - Sports Tonight</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Stand-in "live game" player for the demo (see index.html). No video file and no network:
     Play starts an animated scoreboard so it is obvious on camera that something is playing. -->
<style>
  body { margin:0; font:17px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background:#0d1320; color:#eef2f8; }
  header { background:#16223a; padding:14px 32px; border-bottom:3px solid #d0342c; display:flex; gap:22px; align-items:center; }
  header h1 { margin:0; font-size:22px; }
  header a { color:#9fb0cc; }
  #player { max-width:1100px; margin:26px auto; padding:0 28px; }
  #screen { position:relative; aspect-ratio:16/9; border-radius:16px; overflow:hidden; border:1px solid #2b3b5c;
            background:
              radial-gradient(ellipse at 50% 118%, #c79a5b 0 9%, transparent 9.5%),
              radial-gradient(ellipse at 50% 120%, #4fae5a 0 38%, #2f8a44 39% 60%, #1c5a30 61% 82%, #10233a 83%); }
  #screen::after { content:""; position:absolute; inset:0; background:rgba(5,8,14,.72); transition:opacity .5s; }
  .playing #screen::after { opacity:0; }
  #score { position:absolute; left:22px; top:18px; z-index:2; background:rgba(8,12,22,.85); border-radius:10px; padding:10px 16px;
           font-weight:700; font-size:22px; display:flex; gap:18px; align-items:center; }
  #score small { font-weight:500; color:#9fb0cc; font-size:14px; }
  #live { background:#d0342c; color:#fff; font-size:12px; letter-spacing:.12em; padding:2px 8px; border-radius:6px; visibility:hidden; }
  .playing #live { visibility:visible; animation:pulse 1.4s infinite; }
  #ball { position:absolute; z-index:1; width:16px; height:16px; border-radius:50%; background:#fff; left:48%; top:62%; visibility:hidden; }
  .playing #ball { visibility:visible; animation:pitch 2.6s ease-in infinite; }
  #paused { position:absolute; inset:0; z-index:3; display:grid; place-items:center; font-size:30px; font-weight:650; text-shadow:0 2px 12px #000; }
  .playing #paused { display:none; }
  #controls { display:flex; gap:12px; margin-top:16px; }
  button { font:inherit; font-size:20px; font-weight:650; padding:14px 30px; border-radius:12px; border:1px solid #3a4d76;
           background:#1c2a47; color:#eef2f8; cursor:pointer; }
  button#play { background:#d0342c; border-color:#d0342c; }
  .full header, .full #controls { display:none; }
  .full #player { max-width:none; margin:0; padding:0; }
  .full #screen { border-radius:0; border:0; height:100vh; aspect-ratio:auto; }
  @keyframes pulse { 50% { opacity:.45; } }
  @keyframes pitch { 0% { transform:translate(0,0) scale(.5); } 70% { transform:translate(-30px,120px) scale(1.5); }
                     71% { transform:translate(-30px,120px) scale(1.5); } 100% { transform:translate(260px,-220px) scale(.4); } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<header><h1>Yankees vs Red Sox</h1></header>
<div id="player">
  <div id="screen">
    <div id="score"><span id="live">LIVE</span><span>NYY <span id="nyy">3</span></span><span>BOS <span id="bos">2</span></span><small id="inning">Bottom 6th</small></div>
    <div id="ball"></div>
    <div id="paused">Press Play to watch</div>
  </div>
  <div id="controls">
    <button id="play">Play</button>
    <button id="full">Full Screen</button>
    <button id="back" onclick="location.href='/demo'">Back</button>
  </div>
</div>
<script>
const body = document.body, play = document.getElementById("play");
let timer = null, inning = 6, nyy = 3, bos = 2;
play.onclick = () => {
  const on = body.classList.toggle("playing");
  play.textContent = on ? "Pause" : "Play";
  clearInterval(timer);
  if (on) timer = setInterval(() => {          // the made-up game moves along slowly
    if (Math.random() < 0.5) nyy++; else if (Math.random() < 0.3) bos++;
    inning = Math.min(9, inning + (Math.random() < 0.4 ? 1 : 0));
    document.getElementById("nyy").textContent = nyy;
    document.getElementById("bos").textContent = bos;
    document.getElementById("inning").textContent = "Bottom " + inning + "th";
  }, 9000);
};
document.getElementById("full").onclick = () => body.classList.toggle("full");
document.addEventListener("keydown", e => { if (e.key === "Escape") body.classList.remove("full"); });
</script>
</body>
</html>
