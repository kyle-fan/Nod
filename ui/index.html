<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blink</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No build step, no external files: everything must work with Wi-Fi off.
     Add ?overlay=1 for the floating version (transparent, only star + tiles). -->
<style>
  :root {
    --text:#f2f4f8; --dim:#9aa4b5; --faint:#667085;
    --star:#ffd84a; --star-hi:#fff3a6; --star-lo:#f2b22e; --warn:#fbbf24;
    --glass:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.16);
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; color:var(--text); font:16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    display:grid; grid-template-rows:auto 1fr auto auto; gap:14px; padding:18px 28px 16px;
    background:
      radial-gradient(900px 500px at 12% 8%, rgba(94,234,212,.16), transparent 60%),
      radial-gradient(800px 520px at 88% 20%, rgba(139,92,246,.20), transparent 62%),
      radial-gradient(900px 600px at 50% 110%, rgba(255,216,74,.13), transparent 60%),
      #0a0c12;
    background-attachment:fixed; overflow:hidden;
  }
  .glass {
    background:var(--glass); border:1px solid var(--glass-edge); border-radius:20px;
    -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 30px rgba(0,0,0,.25);
  }

  /* ---- top bar ---- */
  header { display:flex; justify-content:space-between; align-items:center; }
  .brand { font-family:var(--mono); font-weight:700; letter-spacing:.22em; font-size:15px; color:var(--dim); }
  .brand b { color:var(--star); }
  .pill { font-size:12px; color:var(--dim); border:1px solid var(--glass-edge); border-radius:999px;
          padding:4px 10px; margin-left:8px; font-family:var(--mono); }
  .pill.bad { color:var(--warn); border-color:var(--warn); }

  /* ---- transcript: chat bubbles, friend on the left, him on the right, newest biggest ---- */
  #convo { display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; padding:0 4px; min-height:0; gap:8px; }
  .line { max-width:min(70%, 980px); padding:8px 14px; border-radius:16px 16px 16px 5px; font-size:16px; color:var(--dim);
          background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); align-self:flex-start; }
  .line::before { font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
                  display:block; opacity:.75; margin-bottom:1px; }
  .line.friend::before { content:"Friend"; }
  .line.me { align-self:flex-end; border-radius:16px 16px 5px 16px; background:rgba(255,216,74,.09);
             border-color:rgba(255,216,74,.22); color:#e9dfbd; }
  .line.me::before { content:"You"; color:var(--star); }
  .line.latest { font-size:32px; line-height:1.25; color:var(--text); font-weight:600; padding:12px 20px; }
  .line.partial { font-size:22px; color:var(--dim); font-style:italic; border-style:dashed; }
  .line.partial::before { content:"hearing"; font-style:normal; color:#8fd3ff; }

  /* ---- welcome card: shown until the first words, so anyone can see how it works ---- */
  #welcome { align-self:center; margin:auto 0; display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
             width:min(1100px, 100%); }
  #welcome h2 { grid-column:1 / -1; margin:0 0 4px; font-size:30px; font-weight:650; }
  #welcome p.lead { grid-column:1 / -1; margin:0 0 10px; color:var(--dim); font-size:17px; max-width:70ch; }
  .how { padding:16px 16px 14px; border-radius:18px; }
  .how .ico { font-size:30px; line-height:1; }
  .how b { display:block; margin-top:8px; font-size:17px; }
  .how span { color:var(--dim); font-size:14px; }

  /* ---- dock: star + bubble, then tiles ---- */
  #dock { display:grid; gap:14px; }
  #stage { display:flex; align-items:flex-end; gap:16px; min-height:84px; margin-bottom:4px; }
  #star { width:78px; flex:none; filter:drop-shadow(0 0 14px rgba(255,216,74,.45)); transform-origin:50% 90%; }
  #star svg { display:block; width:100%; height:auto; shape-rendering:crispEdges; overflow:visible; }
  .eye { transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite; }
  .talk { opacity:0; }
  #bubble { padding:12px 20px; border-radius:20px 20px 20px 6px; font-size:24px; font-weight:600; margin-bottom:10px;
            max-width:min(900px, 70vw); }
  #bubble small { display:block; font-size:14px; font-weight:400; color:var(--dim); margin-top:2px; }
  #chip { font-family:var(--mono); font-size:13px; color:#1a1400; background:var(--star); border-radius:999px;
          padding:3px 10px; margin-bottom:22px; opacity:0; }
  #chip.show { animation:chip 1.1s ease-out; }

  .s-listen #star, .s-choose #star, .s-computer #star { animation:bob 3.2s ease-in-out infinite; }
  .s-thinking #star { animation:think 1s ease-in-out infinite; }
  .s-speaking #star { animation:hop .5s ease-in-out infinite; }
  .s-speaking .smile { opacity:0; }
  .s-speaking .talk { animation:talk .28s steps(1) infinite; }
  #star.pop svg { animation:pop .32s ease-out; }

  #tiles { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:16px; }
  #tiles:empty { display:none; }
  .tile { min-height:128px; padding:20px 18px; font-size:25px; line-height:1.25; display:flex; align-items:center;
          justify-content:center; text-align:center; border-radius:22px; border-width:2px;
          transition:transform .18s cubic-bezier(.2,.9,.3,1.2), border-color .18s, background .18s, box-shadow .18s; }
  .tile.on { border-color:var(--star); background:rgba(255,216,74,.14); transform:translateY(-8px) scale(1.04);
             box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 4px rgba(255,216,74,.18), 0 18px 44px rgba(255,216,74,.22); }
  .tile { flex-direction:column; gap:6px; }
  .tile .cap { font-family:var(--mono); font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--star); opacity:.9; }
  .tile.yes { border-color:rgba(255,216,74,.45); }
  .tile.meta { color:var(--dim); font-size:20px; border-style:dashed; }
  .tile.meta.on { color:var(--text); }
  .tile.skel { animation:shimmer 1.1s ease-in-out infinite; }
  .tile.skel:nth-child(2) { animation-delay:.12s; } .tile.skel:nth-child(3) { animation-delay:.24s; }
  .tile.skel:nth-child(4) { animation-delay:.36s; }

  /* tile text shrinks a little when it is long, so a full sentence still fits */
  .tile.long { font-size:21px; } .tile.xlong { font-size:18px; }
  /* sending something for real: the Yes tile looks like what it is */
  .tile.yes { border-color:rgba(248,113,113,.7); }
  .tile.yes .cap { color:#fca5a5; }
  .tile.yes.on { border-color:#f87171; background:rgba(248,113,113,.18);
                 box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 4px rgba(248,113,113,.2), 0 18px 44px rgba(248,113,113,.25); }
  .tile.first-done { border-color:rgba(110,231,183,.7); border-style:solid; color:var(--text); }
  .tile.first-done.on { border-color:#6ee7b7; background:rgba(110,231,183,.16);
                        box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 0 0 4px rgba(110,231,183,.2), 0 18px 44px rgba(110,231,183,.22); }

  /* ---- caption: what was just heard or said (the overlay has no transcript panel) ---- */
  #caption { display:none; width:fit-content; align-self:flex-start; max-width:min(1100px, 78vw); padding:9px 18px; border-radius:16px;
             font-size:21px; font-weight:600; opacity:0; transition:opacity .35s; white-space:nowrap; overflow:hidden;
             text-overflow:ellipsis; }
  #caption.show { opacity:1; }
  #caption b { font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; margin-right:10px;
               font-weight:700; vertical-align:middle; }
  #caption.hearing b { color:#8fd3ff; } #caption.heard b { color:#7dffb0; } #caption.said b { color:var(--star); }
  #caption.hearing { font-style:italic; font-weight:500; }

  /* ---- alerts: only shown when something needs attention ---- */
  #alerts { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #alerts:empty { display:none; }
  .alert { font-family:var(--mono); font-size:13px; padding:5px 12px; border-radius:999px; color:#1a1400;
           background:var(--warn); font-weight:700; }
  .alert.info { background:#8fd3ff; }
  .alert.bad { background:#f87171; color:#210404; }

  /* ---- task line: what the computer task is and how far it got ---- */
  #task { display:none; gap:8px; align-items:center; flex-wrap:wrap; font-size:15px; color:var(--dim); }
  #task.show { display:flex; }
  #task .goal { color:var(--text); font-weight:600; font-size:17px; }
  #task .step { font-family:var(--mono); font-size:12px; padding:3px 9px; border-radius:999px;
                border:1px solid var(--glass-edge); color:var(--dim); max-width:260px; overflow:hidden;
                text-overflow:ellipsis; white-space:nowrap; }
  #task .step::before { content:"✓ "; color:#6ee7b7; }

  /* the star leans in while someone is talking */
  .hearing #star { animation:listen .9s ease-in-out infinite; }
  @keyframes listen { 50% { transform:rotate(-7deg) scale(1.06); } }

  .hint { text-align:center; color:var(--faint); font-size:13px; margin:0; font-family:var(--mono); }

  footer { display:flex; gap:10px; align-items:center; }
  footer input { flex:1; background:rgba(255,255,255,.05); color:var(--text); border:1px solid var(--glass-edge);
                 border-radius:12px; padding:10px 12px; font-size:15px; }
  footer button { background:rgba(255,255,255,.09); color:var(--text); border:1px solid var(--glass-edge);
                  border-radius:12px; padding:10px 14px; cursor:pointer; }
  .hidden { display:none !important; }

  /* ---- overlay mode: floats over other apps, so only the dock, on darker glass ---- */
  html.overlay, .overlay body { background:transparent; }
  .overlay body { grid-template-rows:1fr auto; padding:0 28px 22px; }
  .overlay header, .overlay #convo, .overlay footer, .overlay .hint { display:none; }
  .overlay #caption { display:block; background:rgba(15,18,26,.9); border:1px solid rgba(255,255,255,.22);
                      box-shadow:0 6px 22px rgba(0,0,0,.5); }
  .overlay #task { background:rgba(15,18,26,.82); border-radius:14px; padding:6px 12px; width:fit-content; }
  .overlay #dock { grid-row:2; }
  /* a page can't blur other apps' windows behind it, so overlay glass is a tinted sheen instead */
  .overlay .glass { background:linear-gradient(160deg, rgba(52,58,74,.86), rgba(15,18,26,.9) 55%);
                    border-color:rgba(255,255,255,.26);
                    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.4), 0 14px 36px rgba(0,0,0,.45); }
  .overlay .tile.on { background:linear-gradient(160deg, rgba(120,96,18,.95), rgba(58,45,6,.95) 60%);
                      border-color:var(--star); border-width:3px; }
  .overlay .tile.meta { color:#c3cad6; }
  .overlay #star { filter:drop-shadow(0 0 1.5px #000) drop-shadow(0 0 1.5px #000) drop-shadow(0 0 12px rgba(255,216,74,.5)); }

  @keyframes bob { 50% { transform:translateY(-5px); } }
  @keyframes think { 0%,100% { transform:rotate(-9deg) scale(.96); } 50% { transform:rotate(9deg) scale(1.04); } }
  @keyframes hop { 50% { transform:translateY(-9px) scale(1.05,.96); } }
  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.25) rotate(8deg); } 100% { transform:scale(1); } }
  @keyframes blink { 0%,94%,100% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
  @keyframes talk { 0% { opacity:1; } 50% { opacity:0; } }
  @keyframes shimmer { 0%,100% { opacity:.35; } 50% { opacity:.8; } }
  @keyframes chip { 0% { opacity:0; transform:translateY(6px); } 15%,70% { opacity:1; transform:none; } 100% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>✦</b> BLINK</div>
  <div><span class="pill" id="model">on-device</span><span class="pill" id="lat">-- s</span></div>
</header>

<div id="convo"></div>

<div id="dock" class="s-listen">
  <div id="caption"></div>
  <div id="alerts"></div>
  <div id="task"></div>
  <div id="stage">
    <div id="star"></div>
    <div id="bubble" class="glass">Connecting...</div>
    <div id="chip"></div>
  </div>
  <div id="tiles"></div>
  <p class="hint">nod = my turn · tilt = move (hold to keep moving) · smile = pick · open mouth = back</p>
</div>

<footer id="dev">
  <input id="say" placeholder="Dev: type what the friend said, press Enter   (keys: N nod · ← → move · Space pick · Esc back · C recalibrate camera · D hide this bar)">
  <button id="reset">Reset</button>
  <button id="hide">Hide (D)</button>
</footer>

<script>
const $ = id => document.getElementById(id);
if (new URLSearchParams(location.search).get("overlay") === "1") document.documentElement.classList.add("overlay");

// ---- pixel star: one rect per pixel ----
const STAR = [
  ".......X.......", ".......X.......", "......XXX......", "......XXX......",
  "XXXXXXXXXXXXXXX", ".XXXXXXXXXXXXX.", "..XXXXXXXXXXX..", "...XXXXXXXXX...",
  "...XXXXXXXXX...", "..XXXXXXXXXXX..", "..XXXXX.XXXXX..", ".XXXX.....XXXX.",
  ".XXX.......XXX.", "XX...........XX",
];
(function drawStar() {
  const px = (x, y, fill, cls = "", w = 1, h = 1) =>
    `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"${cls ? ` class="${cls}"` : ""}/>`;
  let s = "";
  STAR.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "X") s += px(x, y, y >= 10 ? "var(--star-lo)" : "var(--star)");
  }));
  s += px(7, 1, "var(--star-hi)") + px(6, 3, "var(--star-hi)") + px(2, 4, "var(--star-hi)", "", 3, 1);   // shine
  s += px(5, 6, "#3a2a05", "eye", 1, 2) + px(9, 6, "#3a2a05", "eye", 1, 2);                              // eyes
  s += px(4, 8, "#ff9a8b") + px(10, 8, "#ff9a8b");                                                       // cheeks
  s += `<g class="smile">${px(6, 8, "#3a2a05") + px(8, 8, "#3a2a05") + px(7, 9, "#3a2a05")}</g>`;
  s += px(6, 8, "#3a2a05", "talk", 3, 2);                                                                // open mouth
  $("star").innerHTML = `<svg viewBox="0 0 15 14" aria-hidden="true">${s}</svg>`;
})();

let ws, lastTiles = "", lastConvo = "", lastGestureN = null, lastCaption = "", captionTimer = null;
const GESTURE_LABEL = {nod: "nod", left: "← tilt", right: "tilt →", select: "smile ✓", cancel: "back"};
const SUB = {listen: "Nod when it's your turn", computer: "Pick the next step"};

const WELCOME = `<div id="welcome">
  <h2>Talk and use your Mac with your face</h2>
  <p class="lead">A friend talks. Blink suggests what you might say or do. You choose with small head and face movements, and it speaks or acts for you. Everything runs on this Mac, with Wi-Fi off.</p>
  <div class="how glass"><div class="ico">↕</div><b>Nod</b><span>It's my turn: show me replies</span></div>
  <div class="how glass"><div class="ico">↔</div><b>Tilt your head</b><span>Move the highlight left or right</span></div>
  <div class="how glass"><div class="ico">☺</div><b>Smile</b><span>Pick the highlighted tile</span></div>
  <div class="how glass"><div class="ico">◯</div><b>Open your mouth</b><span>Go back, or open the menu</span></div>
</div>`;

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => { $("bubble").textContent = "Reconnecting..."; setTimeout(connect, 800); };
}

function caption(kind, tag, text, keep) {
  const el = $("caption");
  el.className = kind + " show";
  el.innerHTML = `<b>${tag}</b>${esc(text)}`;
  clearTimeout(captionTimer);
  if (!keep) captionTimer = setTimeout(() => el.classList.remove("show"), 9000);
}

function render(s) {
  $("dock").className = "s-" + s.mode + (s.partial ? " hearing" : "");

  // caption: live words while someone talks, then the finished line, then what he said
  const last = s.history.at(-1);
  const capKey = s.partial + "|" + s.history.length + "|" + (last?.text || "");
  if (capKey !== lastCaption) {
    lastCaption = capKey;
    if (s.partial) caption("hearing", "hearing", s.partial, true);
    else if (last?.who === "friend") caption("heard", "heard", last.text, false);
    else if (last) caption("said", "you said", last.text, false);
    else $("caption").classList.remove("show");
  }

  // alerts: things that stop it working, said plainly
  const cam = s.camera || {}, al = [];
  if (cam.error) al.push(["bad", "Camera not available: use the keyboard, or check camera permission"]);
  else if (cam.on && cam.calibrating) al.push(["info", "Learning your neutral face: sit still for a moment"]);
  else if (cam.on && !cam.face) al.push(["", "Can't see your face: check the camera and lighting"]);
  if (!s.stats.bonsai_ok) al.push(["", "Bonsai is offline: showing basic replies"]);
  if (s.stats.sidecar_ok === false) al.push(["bad", "Voice helper is not answering"]);
  $("alerts").innerHTML = al.map(([c, t]) => `<span class="alert ${c}">${esc(t)}</span>`).join("");

  // task line: the goal and the steps done so far
  const task = s.task;
  $("task").classList.toggle("show", !!(task && (task.goal || task.done.length)));
  if (task) $("task").innerHTML = (task.goal ? `<span class="goal">${esc(task.goal)}</span>` : "")
      + task.done.map(d => `<span class="step">${esc(d.replace(/^Pressed "(.*)"$/, "$1")
          .replace(/^Typed (".*") into .*$/, "wrote $1").replace(/^Opened /, "opened "))}</span>`).join("");

  const confirming = s.tiles.some(t => t.kind === "confirm");
  const sub = confirming ? "Tilt to Yes and smile to confirm" : s.mode in SUB ? SUB[s.mode] : "";
  $("bubble").innerHTML = esc(s.status) + (sub ? `<small>${sub}</small>` : "");
  $("lat").textContent = s.stats.latency_ms != null ? `${(s.stats.latency_ms / 1000).toFixed(1)} s / reply` : "-- s";
  $("model").textContent = s.stats.bonsai_ok ? s.stats.model : "Bonsai offline (fallback)";
  $("model").classList.toggle("bad", !s.stats.bonsai_ok);

  // transcript: only rebuild when it changed
  const convoKey = s.history.length + "|" + s.partial + "|" + (s.history.at(-1)?.text || "");
  if (convoKey !== lastConvo) {
    lastConvo = convoKey;
    const recent = s.history.slice(-6);
    $("convo").innerHTML = (recent.length || s.partial ? "" : WELCOME)
      + recent.map((t, i) =>
        `<div class="line ${t.who}${i === recent.length - 1 ? " latest" : ""}">${esc(t.text)}</div>`).join("")
      + (s.partial ? `<div class="line friend partial">${esc(s.partial)}</div>` : "");
  }

  // tiles: rebuild only when the set changes, otherwise just move the highlight (keeps it smooth)
  const key = s.mode === "thinking" ? "thinking" : JSON.stringify(s.tiles.map(t => [t.kind, t.label]));
  if (key !== lastTiles) {
    lastTiles = key;
    $("tiles").innerHTML = s.mode === "thinking"
      ? '<div class="tile glass skel"></div>'.repeat(4)
      : s.tiles.map(t => {
          const firstDone = t.kind === "done" && s.tiles[0] === t && s.tiles.length > 1;
          const meta = ["more", "else", "done", "home", "kind", "phrases", "redraft"].includes(t.kind) && !firstDone ? " meta" : "";
          const yes = (t.kind === "confirm" && t.value ? " yes" : "") + (firstDone ? " first-done" : "");
          const len = t.label.length > 60 ? " xlong" : t.label.length > 34 ? " long" : "";
          // computer steps say exactly what will happen: press this, type that, open that
          const a = t.kind === "action" ? t.value : null;
          const cap = t.kind === "redraft" ? '<span class="cap">rewrite</span>'
            : t.kind === "confirm" && t.value ? '<span class="cap">this sends it</span>'
            : a ? `<span class="cap">${{press: "press", type: "type", open_app: "open"}[a.type] || ""}</span>` : "";
          const text = a && a.type === "type" ? `“${esc(a.text)}”` : a && a.type === "open_app" ? esc(a.name) : esc(t.label);
          const then = t.then === "computer" ? '<span class="cap">then does it on the mac</span>' : "";
          return `<div class="tile glass${meta}${yes}${len}">${cap}<span>${text}</span>${then}</div>`;
        }).join("");
  }
  if (s.mode !== "thinking")
    [...$("tiles").children].forEach((el, i) => el.classList.toggle("on", i === s.index));

  // the star reacts to every gesture the hub handled
  if (lastGestureN !== null && s.gesture_n !== lastGestureN) {
    for (const [el, cls] of [[$("star"), "pop"], [$("chip"), "show"]]) {
      el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    }
    $("chip").textContent = GESTURE_LABEL[s.last_gesture] || s.last_gesture;
  }
  lastGestureN = s.gesture_n;
}

function esc(x) { return String(x).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function send(msg) { if (ws?.readyState === 1) ws.send(JSON.stringify(msg)); }

document.addEventListener("keydown", e => {
  if (document.activeElement === $("say")) {
    if (e.key === "Enter" && $("say").value.trim()) {
      send({type: "heard", text: $("say").value});
      $("say").value = "";
      $("say").blur();   // so N / arrows / Space work right away
    }
    if (e.key === "Escape") $("say").blur();
    return;
  }
  const map = {n: "nod", N: "nod", ArrowLeft: "left", ArrowRight: "right", " ": "select", Escape: "cancel"};
  if (map[e.key]) { e.preventDefault(); send({type: "gesture", name: map[e.key]}); }
  if (e.key === "d" || e.key === "D") $("dev").classList.toggle("hidden");
  if (e.key === "c" || e.key === "C") {
    send({type: "recalibrate"});
    $("chip").textContent = "recalibrating: sit neutral";
    $("chip").classList.remove("show"); void $("chip").offsetWidth; $("chip").classList.add("show");
  }
});
$("reset").onclick = () => send({type: "reset"});
$("hide").onclick = () => $("dev").classList.add("hidden");
connect();
</script>
</body>
